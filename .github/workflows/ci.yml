name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'conformance/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'conformance/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Whole-tree backstop: the interaction-graph certificates and the dynamical bridges carry no
      # `sorry`, and no kernel check uses `native_decide` (every `by decide` emits a real proof term).
      # Each keyword is matched only as a standalone token, so prose ("sorry-free") and backtick-quoted
      # mentions in docstrings do not trip the check.
      - name: No sorry or native_decide in sources
        run: |
          if grep -rnP '(?<![\w`-])sorry(?![\w`-])' --include='*.lean' GRN Analyze.lean GRN.lean; then
            echo "::error::bare 'sorry' found in sources"; exit 1
          fi
          if grep -rnP '(?<![\w`-])native_decide(?![\w`-])' --include='*.lean' GRN Analyze.lean GRN.lean; then
            echo "::error::'native_decide' found in sources"; exit 1
          fi

      # Builds the whole GRN library (core certificates, the Dynamics layer, and the Interop JSON
      # bridge) and the analyze executable. crnt-lean compiles from source; mathlib is served from
      # the shared olean cache.
      - uses: leanprover/lean-action@v1
        with:
          build-args: GRN analyze
          use-mathlib-cache: true

      # Runs `analyze` over the shared certificate contract in `conformance/cases.json`: the signed
      # interaction graph and every certificate must match the pinned verdict, the bill of parts must
      # match the grounding in the design, and `--echo` must return every field that was sent. The same
      # corpus is checked against the Python reading in the design tool that emits these designs, so a
      # sign-rule change that moves a verdict fails here rather than drifting silently.
      - name: Certificate conformance
        run: python3 conformance/check.py
