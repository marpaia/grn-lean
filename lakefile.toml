name = "grn-lean"
defaultTargets = ["GRN"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[require]]
name = "crnt-lean"
git = "https://github.com/marpaia/crnt-lean.git"
rev = "99137993e729c8add247388718a22a0e0f393dab"

[[lean_lib]]
name = "GRN"
globs = ["GRN", "GRN.+"]

[[lean_exe]]
name = "analyze"
root = "Analyze"
